<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>

<div>
    <div class="mx-auto max-w-screen-xl bg-white">
        <h1 class="mt-20 mb-10 ml-5 text-2xl font-bold text-gray-900">Authors</h1>
        <div class="bg-white py-2 px-3">
            <nav class="flex flex-wrap gap-4">
                <a href="/author/list"
                   class="inline-flex whitespace-nowrap border-b-2 border-transparent border-b-purple-600 py-2 px-3 text-sm font-semibold text-purple-600 transition-all duration-200 ease-in-out">
                    Authors
                </a>
            </nav>
        </div>
    </div>
    <div  class="min-h-screen w-screen bg-gray-50">
        <div class="mx-auto max-w-screen-xl px-2 py-10">
            <div class="mt-4 w-full">
                <div class="flex w-full flex-col items-center justify-end space-y-2 sm:flex-row sm:space-y-0">
                    <a href="/author/add" type="button"
                       class="relative mr-auto inline-flex cursor-pointer items-center rounded-full border border-gray-200 bg-white px-5 py-2 text-center text-sm font-medium text-gray-800 hover:bg-gray-100 focus:shadow sm:mr-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-plus-icon lucide-list-plus mr-1 w-4 h-4"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>
                        Create New Author
                    </a>
                </div>
            </div>

                        <tr class="text-left">
                            <th class="whitespace-normal py-4 text-sm font-medium text-gray-500 sm:px-3">Name</th>
                            <th class="whitespace-normal py-4 text-sm font-medium text-gray-500 sm:px-3">Description</th>
                        </tr>
                    </thead>

                    <tbody th:switch="${authorDto}" class="bg-white lg:border-gray-300">
                        <tr th:each="author:${authorDto}">
                            <td class="whitespace-no-wrap hidden py-4 text-sm font-normal text-gray-600 sm:px-3 lg:table-cell"
                                th:text="${author.name}"></td>
                            <td class="whitespace-no-wrap hidden py-4 text-sm font-normal text-gray-600 sm:px-3 lg:table-cell"
                                th:text="${author.description}"></td>
                        </tr>
                    </tbody>
                    <tbody th:if="${authorDto == null}" class="bg-white lg:border-gray-300">
                    <tr>
                        <td class="whitespace-nowrap py-4 text-sm font-normal text-gray-600 sm:px-3 text-center" colspan="2">

                                    <ellipse cx="50.4207" cy="25.4445" rx="1.11111" ry="1.11111" fill="#4F46E5"></ellipse>
                                    <ellipse cx="54.8651" cy="25.4445" rx="1.11111" ry="1.11111" fill="#4F46E5"></ellipse>

                                <div>
                                    <h2 class="text-center text-gray-900 text-lg medium leading-7 pt-3">
                                        There’s no data
                                    </h2>
                                    <p class="text-center text-gray-400 text-base font-normal leading-relaxed">
                                        Get started to create data
                                    </p>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
